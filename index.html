<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git Branch Tool</title>
<style>
:root{
  --bg:#f6f6f3; --panel:#fff; --ink:#1c1c1a; --muted:#6b6a64; --faint:#9b9a93; --line:#e4e3dd; --hover:#f1f0ec;
  --accent:#2563eb; --accent-ink:#fff; --chip:#efeee9;
  --ok:#15803d; --ok-bg:#e8f5ec; --warn:#a16207; --warn-bg:#fdf3dc; --bad:#b91c1c; --bad-bg:#fbe9e9; --info:#1d4ed8; --info-bg:#e8effd;
  --shadow:0 1px 2px rgba(0,0,0,.05); --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141413; --panel:#1d1d1b; --ink:#ebeae5; --muted:#a19f97; --faint:#77766f; --line:#31302c; --hover:#262522;
  --accent:#5b8def; --chip:#2a2926;
  --ok:#4ade80; --ok-bg:#15291c; --warn:#fbbf24; --warn-bg:#2e2512; --bad:#f87171; --bad-bg:#331a1a; --info:#93b4fb; --info-bg:#1a2338; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#141413; --panel:#1d1d1b; --ink:#ebeae5; --muted:#a19f97; --faint:#77766f; --line:#31302c; --hover:#262522;
  --accent:#5b8def; --chip:#2a2926;
  --ok:#4ade80; --ok-bg:#15291c; --warn:#fbbf24; --warn-bg:#2e2512; --bad:#f87171; --bad-bg:#331a1a; --info:#93b4fb; --info-bg:#1a2338; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif}
button{font:inherit;color:inherit}
code,.mono{font-family:var(--mono);font-size:12.5px}
a{color:var(--accent)}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);background:var(--panel);padding:16px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:650;padding:4px 10px 2px}
.repo{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;margin:6px 0 14px;cursor:pointer}
.repo:hover{border-color:var(--faint)}
.repo .rn{font-weight:600;display:flex;justify-content:space-between;gap:6px}
.repo .rn span{font-weight:400;font-size:12px;color:var(--accent)}
.repo .rp{color:var(--muted);font-size:11.5px;word-break:break-all;margin-top:2px}
.rlist{display:grid;gap:6px;margin:6px 0 4px}
.ritem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.ritem.cur{border-color:var(--accent)}
.ritem .grow{flex:1;min-width:0}.ritem .p{color:var(--muted);font-size:12px;word-break:break-all}
.browser{border:1px solid var(--line);border-radius:10px;margin-top:8px;overflow:hidden}
.browser .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line);background:var(--bg)}
.browser .cur{flex:1 1 100%;font-family:var(--mono);font-size:12px;word-break:break-all}
.browser .ents{max-height:260px;overflow:auto}
.browser .ent{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.browser .ent:hover{background:var(--hover)}.browser .ent .grow{flex:1;min-width:0;word-break:break-all}
.field{display:grid;gap:4px;margin:10px 0}
.field>span{font-size:12.5px;font-weight:600}
.field small{color:var(--muted)}
.field select,.field input[type=text]{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.dsec{margin:14px 0 4px;font-size:13px;font-weight:650}
.lc-sum{display:flex;gap:12px;border-radius:10px;padding:12px 14px;margin:6px 0 10px}
.lc-sum.ok{background:var(--ok-bg)}.lc-sum.warn{background:var(--warn-bg)}.lc-sum.info{background:var(--info-bg)}
.grid>*,.lc-card,.lc-sum>div{min-width:0}
.lc-res>summary,.lc-card>summary{list-style:none;cursor:pointer}
.lc-res>summary::-webkit-details-marker,.lc-card>summary::-webkit-details-marker{display:none}
.lc-res>summary .lc-sum{margin-bottom:0}.lc-res[open]>summary .lc-sum{margin-bottom:10px}
.lc-res>summary:hover .lc-sum{filter:brightness(.98)}
.chev{display:inline-block;transition:transform .15s;color:var(--muted);font-size:12px;line-height:1.6}
details[open]>summary .chev{transform:rotate(90deg)}
.lc-card>summary{gap:8px}.lc-card[open]>summary{margin-bottom:6px}
.lc-when{color:var(--muted);margin-top:4px}
.lc-sum>.chev{align-self:flex-start;margin-top:3px}
.net-search{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.net-search input[type=search]{flex:1 1 320px;min-width:200px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.net-search input[type=search]:focus{outline:2px solid var(--accent);outline-offset:-1px}
.kv{display:grid;gap:6px}
.kv>div{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:baseline}
.kv>div>span{color:var(--muted);font-size:12.5px}.kv>div>b{font-weight:400;min-width:0;word-break:break-word}
@media (max-width:640px){.kv>div{grid-template-columns:1fr}}
.netsvg .intol rect{fill:var(--ok-bg);stroke:var(--ok)}.netsvg .intol text{fill:var(--ok)}
.netsvg .intoold rect{fill:var(--warn-bg);stroke:var(--warn)}.netsvg .intoold text{fill:var(--warn)}
.netsvg .basel rect{fill:var(--chip);stroke:var(--faint)}.netsvg .basel text{fill:var(--muted)}
.netsvg .sell rect{fill:var(--accent);stroke:var(--accent)}.netsvg .sell text{fill:#fff;font-weight:700}
.netsvg .ctxl{opacity:.55}.netsvg .ctxl rect{fill:var(--chip);stroke:var(--faint)}.netsvg .ctxl text{fill:var(--muted)}
.netsvg .dimmed{opacity:.18;filter:blur(1.2px) grayscale(.6)}
.zoom{display:inline-flex;gap:4px}.zoom .btn{min-width:34px;justify-content:center}
.scroll.tall{max-height:72vh;overflow:auto}
#netPanels .scroll{overflow:auto;max-height:72vh;cursor:grab;touch-action:none;user-select:none}
#netPanels .scroll.grabbing{cursor:grabbing}
#netPanels .scroll circle.c{cursor:pointer}
#netDetail:not(:empty){margin-top:16px}
#netPanels{gap:16px}
.ac{position:relative;flex:1 1 320px;min-width:200px;display:flex}
.ac input{width:100%}
.ac-list{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:15;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:340px;overflow:auto;padding:4px}
.ac-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.ac-item:hover,.ac-item.on{background:var(--hover)}
.ac-item mark{background:var(--warn-bg);color:inherit;border-radius:2px;padding:0 1px}
.net-search .chk{white-space:nowrap}
.stats[hidden]{display:none}
.lc-sum .lc-ic{font-size:20px;line-height:1.2}.lc-sum ul{margin:4px 0;padding-left:18px}
.lc-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.lc-card p{margin:6px 0}
.lc-diff{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:420px;margin-top:6px;font-family:var(--mono);font-size:12px;background:var(--bg)}
.lc-hunk{color:var(--faint);padding:4px 8px;border-top:1px solid var(--line);background:var(--panel)}
.lc-hunk:first-child{border-top:0}
.lc-l{display:flex;white-space:pre;padding:0 8px;line-height:1.55}
.lc-l .lc-s{flex:0 0 16px;color:var(--muted)}.lc-l .lc-c{flex:1}.lc-l .lc-m{color:var(--bad);padding-left:8px;font-weight:700}
.lc-l.ctx{color:var(--muted)}
.lc-l.del{background:var(--bad-bg);opacity:.55}.lc-l.add{background:var(--ok-bg);opacity:.55}
.lc-l.bad{opacity:1;font-weight:600}.lc-l.del.bad{box-shadow:inset 3px 0 var(--bad)}.lc-l.add.bad{background:var(--warn-bg);box-shadow:inset 3px 0 var(--warn)}
.lc-leg{border-radius:4px;padding:0 6px;margin-left:6px;font-family:var(--mono);font-size:11.5px}
.lc-leg.del{background:var(--bad-bg)}.lc-leg.add{background:var(--ok-bg)}.lc-leg.bad{color:var(--bad);font-weight:700}
.lc-det{margin-top:8px}.lc-det summary{cursor:pointer;color:var(--accent);font-size:13px}
.lc-det table{margin-top:6px;max-width:520px}.lc-det p,.lc-det ul{font-size:13px}
.guide{max-width:920px}
.guide .toc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.guide .toc a{font-size:12.5px;text-decoration:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;color:var(--ink)}
.guide .toc a:hover{border-color:var(--faint)}
.guide section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.guide h2{font-size:16px;margin:0 0 8px}
.guide h3{font-size:14px;margin:16px 0 6px}
.guide p{margin:6px 0}
.guide ol,.guide ul{margin:6px 0;padding-left:22px}
.guide li{margin:3px 0}
.guide table{margin:8px 0}
.guide td:first-child{white-space:nowrap;font-weight:600}
.guide .tip{background:var(--info-bg);color:var(--ink);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px}
.guide .warn{background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px}
.guide code{background:var(--chip);border-radius:4px;padding:0 4px}
.guide pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;margin:6px 0}
.nav button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer}
.nav button:hover{background:var(--hover)}
.nav button[aria-current="page"]{background:var(--chip);font-weight:600}
.nav .count{font-size:11px;color:var(--muted);background:var(--chip);border-radius:10px;padding:0 7px}
.nav button[aria-current="page"] .count{background:var(--panel)}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;display:grid;gap:6px}

main{padding:20px 28px 60px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:18px}
.top h1{font-size:20px;margin:0;flex:1 1 auto}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.pill b{color:var(--ink);font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:12px}

.grid{display:grid;gap:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 2px;font-size:12.5px;font-weight:500;color:var(--muted)}
.card .big{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2}
.card .sub{font-size:12px;color:var(--muted)}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--faint)}
.section{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.section>header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.section>header h2{font-size:15px;margin:0;flex:1 1 auto}
.section>header .hint{width:100%;color:var(--muted);font-size:12.5px;margin-top:-4px}
.section .body{padding:12px 16px}
.empty{color:var(--muted);padding:18px 16px}

table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
th{font-size:12px;font-weight:500;color:var(--muted);background:var(--panel);position:sticky;top:0}
tbody tr:hover{background:var(--hover)}
tr.expand td{background:var(--bg)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.nw,td.mono{white-space:nowrap}
.tbl-wrap{overflow-x:auto}

.badge{display:inline-block;border-radius:6px;padding:0 7px;font-size:12px;line-height:20px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)}.b-info{background:var(--info-bg);color:var(--info)}.b-mute{background:var(--chip);color:var(--muted)}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps .dot{flex:0 0 8px;height:8px;border-radius:50%;margin-top:7px}
.steps .t{flex:1}
.steps .t small{display:block;color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
.list-check{max-height:420px;overflow:auto}
.list-check label{display:grid;grid-template-columns:20px 1fr auto auto;gap:10px;align-items:center;padding:6px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.list-check label:hover{background:var(--hover)}
.muted{color:var(--muted)}.small{font-size:12px}
.files{margin:4px 0 0;padding-left:18px;font-family:var(--mono);font-size:12px}
.copy{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 10px;margin-top:6px}
.copy code{flex:1;white-space:pre-wrap;word-break:break-all}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;gap:10px;align-items:center;color:var(--muted);padding:24px 16px}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0;width:min(720px,94vw);box-shadow:0 20px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog .dh{padding:16px 18px 8px;font-weight:650;font-size:16px}
dialog .db{padding:0 18px 12px;max-height:70vh;overflow:auto}
dialog .df{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
dialog input[type=text]{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
pre.log{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;max-height:300px;overflow:auto;margin:8px 0 0}
#toast{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:20}
#toast div{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:420px}

/* network */
.net-controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:12.5px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.scroll{overflow-x:auto;overflow-y:hidden}
.netsvg .axis text{fill:var(--muted);font-size:10px}.netsvg .axis line{stroke:var(--line)}
.netsvg .lbl rect{fill:var(--panel)}.netsvg .lbl text{font-size:10px;font-family:var(--mono)}
.netsvg .tagl rect{fill:var(--warn-bg);stroke:var(--warn)}.netsvg .tagl text{fill:var(--warn)}
.netsvg circle.c{cursor:pointer}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{background:var(--chip);border-radius:6px;padding:1px 8px;font-size:12px;color:var(--muted)}
.stat b{color:var(--ink)}.stat .d{margin-left:4px;font-weight:600}.d.good{color:var(--ok)}.d.bad{color:var(--bad)}
#tip{position:fixed;pointer-events:none;z-index:30;max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.2);display:none}
#tip .h{font-family:var(--mono);color:var(--muted)}

@media (max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.nav{display:flex;flex-wrap:wrap;gap:4px}.nav button{width:auto}.side-foot{display:none}main{padding:16px}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Git Branch Tool <span class="small muted" style="font-weight:400">v2</span></div>
    <button class="repo" id="btnRepo"><div class="rn"><b id="repoName">…</b><span data-i18n="repo.change"></span></div><div class="rp" id="repoPath"></div></button>
    <nav class="nav" id="nav">
      <button data-tab="overview" aria-current="page"><span data-i18n="nav.overview"></span></button>
      <button data-tab="features"><span data-i18n="nav.features"></span> <span class="count" id="c-features"></span></button>
      <button data-tab="releases"><span data-i18n="nav.releases"></span> <span class="count" id="c-releases"></span></button>
      <button data-tab="envs"><span data-i18n="nav.envs"></span></button>
      <button data-tab="cleanup"><span data-i18n="nav.cleanup"></span> <span class="count" id="c-cleanup"></span></button>
      <button data-tab="network"><span data-i18n="nav.network"></span></button>
      <button data-tab="guide" style="margin-top:8px;border-top:1px solid var(--line);border-radius:0 0 8px 8px"><span>📖 <span data-i18n="nav.guide"></span></span></button>
    </nav>
    <div class="side-foot">
      <div id="fetchedAt"></div>
      <button class="btn" id="btnFetch"></button>
      <div class="row">
        <button class="btn" id="btnLang" style="flex:1"></button>
        <button class="btn" id="btnTheme" style="flex:1"></button>
      </div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<dialog id="dlg"><div class="dh" id="dlgTitle"></div><div class="db" id="dlgBody"></div><div class="df" id="dlgFoot"></div></dialog>
<div id="toast"></div><div id="tip"></div>

<script>
// ============================================================ i18n
// Values are strings with {placeholders}, or functions of the params (for English plurals).
const pl = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const I18N = {
  en: {
    'lang.switch': '日本語', 'theme': '◐ Theme',
    'repo.change': 'Change', 'repo.title': 'Repositories', 'repo.recent': 'Recent repositories', 'repo.current': 'open',
    'repo.open': 'Open', 'repo.remove': 'Remove from list', 'repo.missing': 'folder not found',
    'repo.add': 'Open another repository', 'repo.pathPh': 'Folder path, e.g. {ex}', 'repo.browse': 'Browse folders…',
    'repo.up': '↑ Up', 'repo.home': 'Home', 'repo.noFolders': 'No folders here.', 'repo.isRepo': 'This folder is a git repository.', 'repo.openThis': 'Open this folder',
    'repo.settings': 'Settings for {name}', 'repo.remote': 'Remote', 'repo.main': 'Main branch',
    'repo.mainHint': 'Released code. Branches merged into it count as merged and can be deleted.',
    'repo.envs': 'Environment branches', 'repo.envsHint': 'Test servers such as dev or staging. The tool never deletes them.',
    'repo.checkPaths': 'Folders for the lost-code check', 'repo.checkPathsHint': 'Comma separated. Default: src. Use "." for the whole repository.',
    'repo.save': 'Save settings', 'repo.saved': 'Settings saved', 'repo.switched': 'Opened {name}', 'repo.opening': 'Opening…',
    'repo.none': 'Choose the git repository to work with.', 'repo.choose': 'Choose repository…', 'repo.noEnvCandidates': 'No other long-lived branches found.',
    'nav.overview': 'Overview', 'nav.features': 'Features', 'nav.envs': 'Environments', 'nav.cleanup': 'Cleanup', 'nav.network': 'Network',
    'nav.releases': 'Releases', 'nav.guide': 'Guide',

    'n.c.title': 'コミット', 'n.c.copy': 'ハッシュをコピー', 'n.c.in': '含まれている', 'n.c.inNone': 'このコミットを含むブランチ・タグはありません。',

// Server messages are English; translate the known ones.
const SERVER_MSG_JA = [
  [/^Refused, not merged into (\S+) \(or protected\): /, '拒否しました。$1 に未マージ、または保護されたブランチです: '],
  [/^Refused, not a merged release branch: /, '拒否しました。マージ済みのリリースブランチではありません: '],
  [/^Refused, not merged or protected: /, '拒否しました。未マージ、または保護されたブランチです: '],
  [/^unknown commit /, '不明なコミット: '], [/^unknown branch /, '不明なブランチ: '], [/^unknown environment /, '不明な環境: '], [/^Nothing selected\.$/, '何も選択されていません。'],
  [/^Folder not found: /, 'フォルダが見つかりません: '], [/^Not a git repository: /, 'gitリポジトリではありません: '],
  [/^This repository has no remote: /, 'このリポジトリにはリモートがありません: '], [/^No branches found on the remote: /, 'リモートにブランチがありません: '],
  [/^No repository selected$/, 'リポジトリが選択されていません'], [/^Cannot remove the repository that is open$/, '使用中のリポジトリは一覧から削除できません'],
  [/^Remote not found: /, 'リモートが見つかりません: '], [/^Branch not found on the remote: /, 'リモートにないブランチです: '],
  [/^The main branch cannot also be an environment branch$/, 'メインブランチを環境ブランチにすることはできません'],
];
let LANG = 'en';
try { LANG = localStorage.getItem('gbt-lang') || ((navigator.language || '').startsWith('ja') ? 'ja' : 'en'); } catch (e) {}
function t(key, p = {}) {
  const v = I18N[LANG][key] ?? I18N.en[key] ?? key;
  return typeof v === 'function' ? v(p) : v.replace(/\{(\w+)\}/g, (m, k) => (p[k] ?? m));
}
const srv = msg => LANG === 'ja' ? SERVER_MSG_JA.reduce((s, [re, rep]) => s.replace(re, rep), msg) : msg;
function applyStatic() {
  document.documentElement.lang = LANG;

  $('#btnLang').textContent = t('lang.switch');
  $('#btnTheme').textContent = t('theme');
  $('#btnFetch').textContent = t('fetch');
  $('#fetchedAt').textContent = t('lastFetch', { d: S.ov && S.ov.fetchedAt ? S.ov.fetchedAt.slice(0, 16) : (S.ov ? t('unknown') : '—') });
}

// ============================================================ basics
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const S = { ov: null, tab: 'overview', graph: null, results: {}, openRows: new Set(), lcOpen: {} };
try { S.tab = localStorage.getItem('gbt-tab') || 'overview'; } catch (e) {}
if (['overview', 'features', 'releases', 'envs', 'cleanup', 'network', 'guide'].includes(location.hash.slice(1))) S.tab = location.hash.slice(1);
try { const th = localStorage.getItem('gbt-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}

async function api(path, body) {
  const opt = body === undefined ? { headers: { 'x-git-tool': '1' } } : { method: 'POST', headers: { 'content-type': 'application/json', 'x-git-tool': '1' }, body: JSON.stringify(body) };
  const r = await fetch(path, opt); const j = await r.json();
  if (!r.ok) { const e = new Error(srv(j.error || r.statusText)); e.noRepo = !!j.noRepo; throw e; }
  return j;
}
function toast(msg) { const d = document.createElement('div'); d.textContent = msg; $('#toast').append(d); setTimeout(() => d.remove(), 4200); }
function copyBtn(text) { return `<div class="copy"><code>${esc(text)}</code><button class="btn sm" data-copy="${esc(text)}">${esc(t('copy'))}</button></div>`; }
document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]'); if (!c) return;
  navigator.clipboard.writeText(c.dataset.copy).then(() => toast(t('copied')));
});
const badge = (cls, txt) => `<span class="badge ${cls}">${esc(txt)}</span>`;
const spin = txt => `<span class="spinner"></span> ${esc(txt)}`;

// ============================================================ load
async function load(refresh) {
  try {
    S.ov = await api('/api/overview' + (refresh ? '?refresh=1' : ''));
    S.graph = null;
    updateSidebar();
    show(S.tab);
  } catch (e) {
    if (e.noRepo) return noRepoScreen();
    $('#main').innerHTML = `<div class="section"><div class="empty">${esc(t('readFail'))}<pre class="log">${esc(e.message)}</pre></div></div>`;
  }
}
function updateSidebar() {
  $('#repoName').textContent = S.ov.repo;
  $('#repoPath').textContent = S.ov.repoPath;
  $('#btnRepo').title = S.ov.remoteUrl || '';
  $('#c-features').textContent = S.ov.features.length;
  $('#c-cleanup').textContent = derive().cleanupCount || '';
  $('#c-releases').textContent = (S.ov.releases || []).length || '';
  applyStatic();
}
function derive() {
  const ov = S.ov;
  const remoteDel = ov.refs.filter(r => r.merged && !['env', 'main', 'release'].includes(r.kind));
  const relTag = ov.refs.filter(r => r.kind === 'release' && r.merged);
  const afterRelease = ov.features.filter(f => f.inRelease.length);
  const localDel = ov.local.filter(b => b.merged && !b.protected);
  return { remoteDel, relTag, afterRelease, localDel, cleanupCount: remoteDel.length + relTag.length + localDel.length };
}

// ============================================================ shell
document.getElementById('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(b.dataset.tab); });
$('#btnFetch').addEventListener('click', async () => {

  try { const r = await api('/api/fetch', {}); toast(r.ok ? t('fetched') : t('fetchFailed')); S.results = {}; await load(true); }

});
$('#btnTheme').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next;
  try { localStorage.setItem('gbt-theme', next); } catch (e) {}

});
$('#btnLang').addEventListener('click', () => {

function show(tab) {
  S.tab = tab; try { localStorage.setItem('gbt-tab', tab); } catch (e) {}
  history.replaceState(null, '', '#' + tab);
  document.querySelectorAll('#nav button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  if (tab === 'guide') { vGuide(); window.scrollTo(0, 0); return; }   // the guide needs no repository data

function topbar(title, extra = '') {

}

// ============================================================ overview
function vOverview() {
  const ov = S.ov, d = derive(), F = ov.features, main = ov.main;
  const conflicting = F.filter(f => f.conflicts && f.conflicts.length);
  const behind = F.filter(f => f.behind > 0 && !(f.conflicts && f.conflicts.length));
  const contains = F.filter(f => f.contains.length);
  const steps = [];
  if (d.remoteDel.length) steps.push(['bad', t('s.delRemote', { n: d.remoteDel.length }), t('s.delRemoteD', { main }), 'cleanup']);
  if (d.relTag.length) steps.push(['warn', t('s.tag', { n: d.relTag.length }), t('s.tagD'), 'cleanup']);
  conflicting.forEach(f => steps.push(['bad', t('s.rebase', { b: f.short, main }), t('s.rebaseD', { main, n: f.conflicts.length, o: f.authors.join(', ') }), 'features']));
  if (behind.length) steps.push(['warn', t('s.behind', { n: behind.length, main }), t('s.behindD', { list: behind.map(f => f.short.replace(/^feature\//, '')).join(', ') }), 'features']);
  contains.forEach(f => steps.push(['warn', t('s.contains', { b: f.short }), t('s.containsD', { list: f.contains.join(', ') }), 'features']));
  ov.envs.forEach(e => {
    if (e.mergeBases > 1) steps.push(['warn', t('s.tangled', { e: e.name, n: e.mergeBases, main }), t('s.tangledD', { main }), 'envs']);
    const old = e.tickets.filter(x => x.state === 'old');
    if (old.length) steps.push(['info', t('s.old', { e: e.name, n: old.length }), t('s.oldD', { list: old.map(x => x.short).join(', '), e: e.name }), 'envs']);
  });
  (ov.releases || []).forEach(r => {
    const old = r.included.filter(x => x.state === 'outdated'), rw = r.included.filter(x => x.state === 'rewritten');
    if (old.length) steps.unshift(['bad', t('s.relOutdated', { r: r.name, n: old.length }), t('s.relOutdatedD', { list: old.map(x => x.short).join(', ') }), 'releases']);
    if (rw.length) steps.push(['warn', t('s.relRewritten', { r: r.name, n: rw.length }), t('s.relRewrittenD', { list: rw.map(x => x.short).join(', ') }), 'releases']);
    if (r.conflicts && r.conflicts.length) steps.unshift(['bad', t('s.relConflict', { r: r.name, main }), t('s.relConflictD', { n: r.conflicts.length }), 'releases']);
    if (r.behind) steps.push(['warn', t('s.relBehind', { r: r.name, n: r.behind, main }), t('s.relBehindD', { main }), 'releases']);
    if (r.envMerges.length) steps.unshift(['bad', t('s.relEnv', { r: r.name }), t('s.relEnvD'), 'releases']);
    if (r.direct.length) steps.push(['info', t('s.relDirect', { r: r.name, n: r.direct.length }), t('s.relDirectD'), 'releases']);
  });
  if (d.localDel.length) steps.push(['info', t('s.local', { n: d.localDel.length }), t('s.localD', { main }), 'cleanup']);
  if (ov.stashes.length) steps.push(['info', t('s.stash', { n: ov.stashes.length }), t('s.stashD'), null]);

  const byKind = k => ov.refs.filter(r => r.kind === k).length;
  $('#main').innerHTML = topbar(t('ov.title')) + `
  <div class="grid">
    <div class="cards">
      ${card(t('ov.cardBranches'), ov.refs.length, t('ov.cardBranchesSub', { f: byKind('feature'), r: byKind('release'), m: byKind('env') + 1 }), 'cleanup')}
      ${card(t('ov.cardDelete'), d.remoteDel.length + d.relTag.length, t('ov.cardDeleteSub', { m: d.remoteDel.length, r: d.relTag.length }), 'cleanup', d.remoteDel.length ? 'bad' : 'ok')}
      ${card(t('ov.cardUnreleased'), F.length, d.afterRelease.length ? t('ov.cardUnreleasedRel', { n: d.afterRelease.length }) : t('ov.cardUnreleasedNot', { main }), 'features')}
      ${card(t('ov.cardConflict', { main }), conflicting.length, conflicting.length ? t('ov.needRebase') : t('ov.allClean'), 'features', conflicting.length ? 'bad' : 'ok')}
      ${(() => { const rs = ov.releases || [], bad = rs.reduce((n, r) => n + r.included.filter(x => x.state === 'outdated').length, 0);
        return card(t('ov.cardReleases'), rs.length, rs.length ? (bad ? t('ov.cardReleasesBad', { n: bad }) : t('ov.cardReleasesOk')) : t('ov.cardReleasesNone'), 'releases', bad ? 'bad' : undefined); })()}
      ${ov.envs.map(e => card(e.name, e.behind ? t('ov.envBehind', { n: e.behind }) : t('ov.envUpToDate'), t('ov.envSub', { a: e.ahead, main, m: e.merges, b: e.mergeBases }), 'envs', e.behind || e.mergeBases > 1 ? 'warn' : 'ok')).join('')}
    </div>
    ${envMatrix()}
    <div class="section"><header><h2>${esc(t('ov.steps'))}</h2></header>
      ${steps.length ? `<ul class="steps">${steps.map(([lvl, ti, s, tab]) => `<li><span class="dot" style="background:var(--${lvl})"></span><div class="t">${esc(ti)}<small>${esc(s)}</small></div>${tab ? `<button class="btn sm" data-go="${tab}">${esc(t('open'))}</button>` : ''}</li>`).join('')}</ul>` : `<div class="empty">${esc(t('ov.noSteps'))}</div>`}
    </div>
  </div>`;
  $('#main').querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => show(b.dataset.go)));
  $('#main').querySelectorAll('[data-feat]').forEach(tr => tr.addEventListener('click', () => { S.openRows.add(tr.dataset.feat); show('features'); }));
}
// Where is each unreleased feature: one column per environment branch, plus open releases
function envMatrix() {
  const ov = S.ov, envs = ov.envNames;
  if (!ov.features.length) return '';
  const rank = f => envs.reduce((n, e) => n + (f.env[e] === 'full' ? 2 : f.env[e] === 'old' ? 1 : 0), 0);
  const rows = ov.features.slice().sort((a, b) => rank(b) - rank(a) || (a.ticket || '').localeCompare(b.ticket || ''));
  const cell = s => s === 'full' ? badge('b-ok', t('f.latest')) : s === 'old' ? badge('b-warn', t('f.oldVersion')) : '<span class="muted">—</span>';
  const head = e => {
    const n = ov.features.filter(f => f.env[e] !== 'none').length, old = ov.features.filter(f => f.env[e] === 'old').length;
    return `<th>${esc(e)} <span class="muted" style="font-weight:400">(${n}${old ? ` · ${esc(t('ov.envOld', { n: old }))}` : ''})</span></th>`;
  };
  return `<div class="section"><header><h2>${esc(t('ov.envT'))}</h2><div class="hint">${esc(t('ov.envHint'))}</div></header>
    <div class="tbl-wrap"><table><thead><tr><th>${esc(t('f.th.branch'))}</th><th>${esc(t('f.th.owner'))}</th>${envs.map(head).join('')}<th>${esc(t('f.th.release'))}</th></tr></thead>
    <tbody>${rows.map(f => `<tr data-feat="${esc(f.short)}" style="cursor:pointer"><td class="mono">${esc(f.short)}</td><td>${esc(f.authors.join(', '))}</td>${envs.map(e => `<td>${cell(f.env[e])}</td>`).join('')}<td>${relCell(f)}</td></tr>`).join('')}</tbody></table></div></div>`;
}
function card(title, big, sub, go, tone) {
  const color = tone ? `style="color:var(--${tone})"` : '';
  return `<div class="card click" data-go="${go}"><h3>${esc(title)}</h3><div class="big" ${color}>${esc(big)}</div><div class="sub">${esc(sub)}</div></div>`;
}

// ============================================================ features
function vFeatures() {
  const ov = S.ov, envs = ov.envNames, main = ov.main;
  const rows = ov.features.slice().sort((a, b) => (b.conflicts?.length || 0) - (a.conflicts?.length || 0) || (a.ticket || '').localeCompare(b.ticket || ''));
  const envCell = s => s === 'full' ? badge('b-ok', t('f.latest')) : s === 'old' ? badge('b-warn', t('f.oldVersion')) : badge('b-mute', '—');
  const fc = S.results.featureConflicts;
  $('#main').innerHTML = topbar(t('f.title'), `<button class="btn" id="btnPairs">${esc(t('f.pairsBtn'))}</button>`) + `
  <div class="grid">
    <div class="section"><header><h2>${esc(t('f.section', { n: rows.length }))}</h2><div class="hint">${esc(t('f.hint', { main }))}</div></header>
    <div class="tbl-wrap"><table>
      <thead><tr><th>${esc(t('f.th.branch'))}</th><th>${esc(t('f.th.owner'))}</th><th>${esc(t('f.th.last'))}</th><th>${esc(t('f.th.commits'))}</th><th>${esc(t('f.th.base'))}</th><th>${esc(t('f.th.conflict', { main }))}</th>${envs.map(e => `<th>${esc(e)}</th>`).join('')}<th>${esc(t('f.th.release'))}</th><th>${esc(t('f.th.contains'))}</th></tr></thead>
      <tbody>${rows.map(f => {
        const open = S.openRows.has(f.short);
        const base = f.behind === 0 ? badge('b-ok', t('f.current')) : badge('b-warn', t('f.behind', { n: f.behind }));
        const conf = f.conflicts == null ? badge('b-mute', '?') : f.conflicts.length ? badge('b-bad', t('f.files', { n: f.conflicts.length })) : badge('b-ok', t('none'));
        let html = `<tr data-row="${esc(f.short)}" style="cursor:pointer"><td class="mono">${open ? '▾' : '▸'} ${esc(f.short)}</td><td>${esc(f.authors.join(', '))}</td><td class="nw">${esc(f.date)}</td><td style="font-variant-numeric:tabular-nums">${f.ahead}</td><td>${base}</td><td>${conf}</td>${envs.map(e => `<td>${envCell(f.env[e])}</td>`).join('')}<td>${relCell(f)}</td><td>${f.contains.length ? badge('b-warn', f.contains.join(', ')) : '<span class="muted">—</span>'}</td></tr>`;
        if (open) html += `<tr class="expand"><td colspan="${9 + envs.length}">${featureDetail(f)}</td></tr>`;
        return html;
      }).join('')}</tbody></table></div></div>
    ${fc ? pairsSection(fc) : ''}
  </div>`;
  $('#main').querySelectorAll('[data-row]').forEach(tr => tr.addEventListener('click', () => {
    const k = tr.dataset.row; S.openRows.has(k) ? S.openRows.delete(k) : S.openRows.add(k); vFeatures();
  }));
  $('#main').querySelectorAll('[data-netshow]').forEach(b => b.addEventListener('click', ev => { ev.stopPropagation(); S.netQuery = b.dataset.netshow; show('network'); }));
  $('#btnPairs').addEventListener('click', async () => {
    const b = $('#btnPairs'); b.disabled = true; b.innerHTML = spin(t('f.pairsRunning'));
    try { S.results.featureConflicts = await api('/api/feature-conflicts'); } catch (e) { toast(e.message); }
    if (S.tab === 'features') vFeatures();
  });
}
function featureDetail(f) {
  const ov = S.ov, main = ov.main;
  const cmd = `git checkout ${f.short}\ngit fetch && git rebase ${ov.remote}/${main}\ngit push --force-with-lease`;
  return `<div class="grid" style="gap:10px;padding:4px 0">
    <div><button class="btn sm" data-netshow="${esc(f.short)}">🔎 ${esc(t('f.showNet'))}</button></div>
    ${f.conflicts && f.conflicts.length ? `<div><b>${esc(t('f.d.conflicts', { main }))}</b> ${esc(t('f.d.conflictsD'))}<ul class="files">${f.conflicts.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    ${f.behind > 0 ? `<div><b>${esc(t('f.d.update', { main }))}</b> ${esc(t('f.d.updateD', { n: f.ahead }))}${copyBtn(cmd)}</div>` : `<div class="muted">${esc(t('f.d.based', { main }))}</div>`}
    <div><b>${esc(t('f.d.commits'))}</b><table style="margin-top:4px"><tbody>${f.commits.map(c => `<tr><td class="mono">${esc(c.h)}</td><td class="nw">${esc(c.d)}</td><td>${esc(c.a)}</td><td>${esc(c.s)}</td></tr>`).join('')}</tbody></table></div>
  </div>`;
}
function pairsSection(fc) {
  return `<div class="section"><header><h2>${esc(t('f.p.title', { n: fc.pairs.length }))}</h2><div class="hint">${esc(t('f.p.hint'))}</div></header>
  ${fc.pairs.length ? `<div class="tbl-wrap"><table><thead><tr><th>${esc(t('f.p.a'))}</th><th>${esc(t('f.p.b'))}</th><th>${esc(t('f.p.files'))}</th></tr></thead><tbody>${fc.pairs.map(p => `<tr><td class="mono">${esc(p.a)}</td><td class="mono">${esc(p.b)}</td><td><ul class="files" style="margin:0">${p.files.map(f => `<li>${esc(f)}</li>`).join('')}</ul></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">${esc(t('f.p.none'))}</div>`}</div>`;

// ============================================================ releases
// Release column in the Features table: latest / outdated / rewritten, per open release
function relCell(f) {
  const out = [];
  (S.ov.releases || []).forEach(r => {
    const x = r.included.find(i => i.short === f.short); if (!x) return;
    out.push(x.state === 'latest' ? badge('b-info', r.name) : badge(x.state === 'outdated' ? 'b-bad' : 'b-warn', `${r.name} ${t('rel.oldShort')}`));
  });
  return out.length ? out.join(' ') : '<span class="muted">—</span>';
}
const REL_STATE = {
  latest: x => badge('b-ok', t('rel.latest')),
  outdated: x => badge('b-bad', t('rel.outdated', { n: x.missing.length })),
  rewritten: x => badge('b-warn', t('rel.rewritten')),
  deleted: x => badge('b-mute', t('rel.deleted')),
};
function vReleases() {
  const ov = S.ov, rs = ov.releases || [];
  $('#main').innerHTML = topbar(t('rel.title')) + (rs.length
    ? `<div class="grid">${rs.map(releaseSection).join('')}</div>`
    : `<div class="section"><div class="empty">${esc(t('rel.none', { main: ov.main }))}</div></div>`);
  $('#main').querySelectorAll('[data-relrow]').forEach(tr => tr.addEventListener('click', () => {
    const k = tr.dataset.relrow; S.openRows.has(k) ? S.openRows.delete(k) : S.openRows.add(k); vReleases();
  }));
}
function releaseSection(r) {
  const ov = S.ov, main = ov.main, envs = ov.envNames;
  const inc = r.included.slice().sort((a, b) => ['outdated', 'rewritten', 'deleted', 'latest'].indexOf(a.state) - ['outdated', 'rewritten', 'deleted', 'latest'].indexOf(b.state) || a.short.localeCompare(b.short));
  const nBad = inc.filter(x => x.state === 'outdated').length;
  const base = r.behind ? badge('b-warn', t('rel.behind', { n: r.behind, main })) : badge('b-ok', t('rel.basedOn', { main }));
  const conf = r.conflicts == null ? '' : r.conflicts.length ? badge('b-bad', t('rel.conflicts', { main, n: r.conflicts.length })) : badge('b-ok', t('rel.noConflict', { main }));
  const envCell = s => s === 'full' ? badge('b-ok', t('f.latest')) : s === 'old' ? badge('b-warn', t('f.oldVersion')) : '<span class="muted">—</span>';
  const rows = inc.map(x => {
    const key = r.name + '|' + x.short, open = S.openRows.has(key), canOpen = x.state === 'outdated' || x.state === 'rewritten';
    let h = `<tr ${canOpen ? `data-relrow="${esc(key)}" style="cursor:pointer"` : ''}><td class="mono">${canOpen ? (open ? '▾ ' : '▸ ') : ''}${esc(x.short)}</td><td>${esc((x.authors || []).join(', '))}</td><td>${REL_STATE[x.state](x)}</td>${envs.map(e => `<td>${envCell((x.env || {})[e])}</td>`).join('')}<td>${esc(x.title || '')}</td></tr>`;
    if (open && canOpen) {
      const cmd = `git checkout ${r.name}\ngit pull\ngit merge --no-ff ${ov.remote}/${x.short}\ngit push`;
      h += `<tr class="expand"><td colspan="${4 + envs.length}"><div class="grid" style="gap:8px;padding:4px 0">
        ${x.state === 'outdated' ? `<div><b>${esc(t('rel.missingT'))}</b><table style="margin-top:4px"><tbody>${x.missing.map(c => `<tr><td class="mono">${esc(c.h)}</td><td class="nw">${esc(c.d)}</td><td>${esc(c.a)}</td><td>${esc(c.s)}</td></tr>`).join('')}</tbody></table></div>`
          : `<div class="small">${esc(t('rel.rewrittenD'))}</div>`}
        <div><b>${esc(t('rel.fix'))}</b>${copyBtn(cmd)}</div></div></td></tr>`;
    }
    return h;
  }).join('');
  const notes = [r.name, ...inc.map(x => {
    const label = x.short.replace(/^(feature|hotfix|bugfix)\//, '');
    return !x.title ? `- ${label}` : x.title.includes(label) ? `- ${x.title}` : `- ${label}: ${x.title}`;
  })].join('\n');
  return `<div class="section">
    <header><h2>${esc(r.name)}</h2>${base}${conf}<span class="pill">${esc(t('rel.ahead', { n: r.ahead, main }))}</span>
      <div class="hint">${esc(t('e.last'))} ${esc(r.date)} ${esc(r.author)} — ${esc(r.subject)}</div></header>
    <div class="body grid" style="gap:18px">
      ${r.envMerges.length ? `<div><b style="color:var(--bad)">${esc(t('rel.envMergesT'))}</b><div class="small muted">${esc(t('rel.envMergesD'))}</div><ul class="files">${r.envMerges.map(s => `<li>${esc(s)}</li>`).join('')}</ul></div>` : ''}
      <div><div class="row"><b style="flex:1">${esc(t('rel.featuresT', { n: inc.length }))}</b>${nBad ? badge('b-bad', t('rel.nOutdated', { n: nBad })) : inc.length ? badge('b-ok', t('rel.allLatest')) : ''}</div>
        <div class="small muted">${esc(t('rel.featuresD'))}</div>
        ${inc.length ? `<div class="tbl-wrap" style="margin-top:6px"><table><thead><tr><th>${esc(t('f.th.branch'))}</th><th>${esc(t('f.th.owner'))}</th><th>${esc(t('rel.th.state'))}</th>${envs.map(e => `<th>${esc(e)}</th>`).join('')}<th>${esc(t('rel.th.title'))}</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="empty">${esc(t('rel.noFeatures'))}</div>`}</div>
      <div><b>${esc(t('rel.directT', { n: r.direct.length }))}</b><div class="small muted">${esc(t('rel.directD'))}</div>
        ${r.direct.length ? `<table style="margin-top:6px"><tbody>${r.direct.map(c => `<tr><td class="mono">${esc(c.h)}</td><td class="nw">${esc(c.d)}</td><td>${esc(c.a)}</td><td>${esc(c.s)}</td></tr>`).join('')}</tbody></table>` : `<div class="small" style="margin-top:4px">${badge('b-ok', t('rel.noDirect'))}</div>`}</div>
      <div><b>${esc(t('rel.candT', { n: r.candidates.length }))}</b><div class="small muted">${esc(t('rel.candD'))}</div>
        ${r.candidates.length ? `<div class="tbl-wrap" style="margin-top:6px"><table><thead><tr><th>${esc(t('f.th.branch'))}</th><th>${esc(t('f.th.owner'))}</th>${envs.map(e => `<th>${esc(e)}</th>`).join('')}<th>${esc(t('f.th.conflict', { main }))}</th></tr></thead><tbody>${r.candidates.map(c => `<tr><td class="mono">${esc(c.short)}</td><td>${esc(c.authors.join(', '))}</td>${envs.map(e => `<td>${envCell(c.env[e])}</td>`).join('')}<td>${c.conflicts == null ? '?' : c.conflicts.length ? badge('b-bad', t('f.files', { n: c.conflicts.length })) : badge('b-ok', t('none'))}</td></tr>`).join('')}</tbody></table></div>` : ''}</div>
      <div><b>${esc(t('rel.notesT'))}</b><div class="small muted">${esc(t('rel.notesD'))}</div>${copyBtn(notes)}</div>
    </div></div>`;
}

// ============================================================ environments
function vEnvs() {
  const ov = S.ov;
  $('#main').innerHTML = topbar(t('e.title')) + `<div class="grid">${ov.envs.map(envSection).join('')}</div>`;
  ov.envs.forEach(e => {
    // Run check: fetch the latest data from the remote first, refresh everything, then check
    $(`#chk-${e.name}`).addEventListener('click', async ev => {
      const b = ev.currentTarget; b.disabled = true; b.innerHTML = spin(t('e.fetchingFirst'));
      let fetched = false;
      try { fetched = (await api('/api/fetch', {})).ok; } catch (err) {}
      try { S.ov = await api('/api/overview?refresh=1'); S.graph = null; updateSidebar(); } catch (err) {}
      b.innerHTML = spin(t('e.checking'));
      try {
        const r = await api('/api/env-check?env=' + encodeURIComponent(e.name));
        S.results['check-' + e.name] = { ...r, fetched, checkedAt: new Date().toTimeString().slice(0, 5) };
        S.lcOpen['res|' + e.name] = true;
      } catch (err) { toast(err.message); }
      if (S.tab === 'envs') vEnvs();
    });
    // remember which parts of the result are open
    document.querySelectorAll(`details[data-key^="res|${e.name}"], details[data-key^="file|${e.name}|"]`).forEach(d => d.addEventListener('toggle', () => { S.lcOpen[d.dataset.key] = d.open; }));
    document.querySelectorAll(`[data-lcall="${e.name}"]`).forEach(btn => btn.addEventListener('click', () => {
      const open = btn.dataset.v === '1';
      document.querySelectorAll(`details[data-key^="file|${e.name}|"]`).forEach(d => { d.open = open; S.lcOpen[d.dataset.key] = open; });
    }));
    $(`#rb-${e.name}`).addEventListener('click', async ev => {
      const picked = [...document.querySelectorAll(`input[data-rb="${e.name}"]:checked`)].map(i => i.value);
      S.results['pick-' + e.name] = picked;
      ev.currentTarget.disabled = true; ev.currentTarget.innerHTML = spin(t('e.rbRunning'));
      try { S.results['rb-' + e.name] = await api('/api/rebuild-preview', { env: e.name, branches: picked }); } catch (err) { toast(err.message); }
      if (S.tab === 'envs') vEnvs();
    });
  });
}
function envSection(e) {
  const ov = S.ov, main = ov.main, check = S.results['check-' + e.name], rb = S.results['rb-' + e.name];
  const picked = S.results['pick-' + e.name] || e.tickets.map(x => x.short);
  const health = e.mergeBases > 1 ? badge('b-warn', t('e.tangled', { n: e.mergeBases })) : e.behind ? badge('b-warn', t('e.behind', { n: e.behind, main })) : badge('b-ok', t('e.upToDate', { main }));
  const pickList = ov.features.map(f => `<label class="chk" style="padding:3px 0"><input type="checkbox" data-rb="${esc(e.name)}" value="${esc(f.short)}" ${picked.includes(f.short) ? 'checked' : ''}><span class="mono">${esc(f.short)}</span>${f.conflicts && f.conflicts.length ? badge('b-bad', t('e.conflictsMain', { main })) : ''}</label>`).join('');
  const cmds = `git checkout ${e.name}\ngit reset --hard ${ov.remote}/${main}\n` + picked.map(b => `git merge --no-ff --no-edit ${ov.remote}/${b}`).join('\n') + `\ngit push --force-with-lease ${ov.remote} ${e.name}`;
  return `<div class="section">
    <header><h2>${esc(e.name)}</h2>${health}<span class="pill">${esc(t('e.aheadBehind', { a: e.ahead, b: e.behind, main }))}</span><span class="pill">${esc(t('e.merges', { n: e.merges }))}</span>
      <div class="hint">${esc(t('e.last'))} ${esc(e.date)} ${esc(e.author)} — ${esc(e.subject)}</div></header>
    <div class="body grid" style="gap:16px">
      <div><b>${esc(t('e.features', { e: e.name }))}</b><div class="row" style="margin-top:6px">${e.tickets.length ? e.tickets.map(x => badge(x.state === 'full' ? 'b-ok' : 'b-warn', x.short + (x.state === 'old' ? t('e.oldMark') : ''))).join(' ') : `<span class="muted">${esc(t('none'))}</span>`}</div></div>

      <div><div class="row"><b style="flex:1">${esc(t('e.check'))}</b><button class="btn" id="chk-${esc(e.name)}">${esc(t('e.checkBtn'))}</button></div>
        <div class="small muted">${esc(t('e.checkD', { e: e.name, main }))}</div>
        ${check ? checkResult(check) : ''}</div>

      <div><div class="row"><b style="flex:1">${esc(t('e.rb'))}</b><button class="btn primary" id="rb-${esc(e.name)}">${esc(t('e.rbBtn'))}</button></div>
        <div class="small muted">${esc(t('e.rbD', { main }))}</div>
        <div style="columns:2 260px;margin-top:8px">${pickList}</div>
        ${rb ? rebuildResult(rb, cmds) : ''}</div>
    </div></div>`;
}
// Lost-code check result: a one-sentence answer, the breakdown, then one card per problem file
function checkResult(c) {
  const env = c.env, main = c.main, P = { e: env, main };
  const miss = c.problems.filter(p => p.missingCount), unk = c.problems.filter(p => !p.missingCount);
  const when = `<div class="small lc-when">${esc(c.fetched ? t('lc.checkedAt', { time: c.checkedAt }) : t('lc.checkedOld', { time: c.checkedAt }))}</div>`;
  // the verdict is the clickable summary line of the whole result
  const verdict = !c.problems.length
    ? `<div class="lc-sum ok"><span class="chev">▸</span><div class="lc-ic">✅</div><div style="flex:1"><b>${esc(t('lc.okT', P))}</b><div>${esc(t('lc.okD', { ...P, n: c.filesDiffering, f: c.features.length }))}</div>${when}</div></div>`
    : `<div class="lc-sum warn"><span class="chev">▸</span><div class="lc-ic">⚠️</div><div style="flex:1"><b>${esc(t('lc.badT', { ...P, n: c.problems.length }))}</b>
        <ul>${miss.length ? `<li>🔴 ${esc(t('lc.badMissing', { ...P, n: miss.length }))}</li>` : ''}${unk.length ? `<li>🟡 ${esc(t('lc.badUnknown', { ...P, n: unk.length }))}</li>` : ''}</ul>
        <div class="small">${esc(t('lc.badRest', { ...P, n: c.explainedFiles }))}</div>${when}</div></div>`;
  let h = '';
  if (c.behind && c.problems.some(p => p.releasedSince.length)) {
    const cmd = `git checkout ${env}\ngit pull\ngit merge --no-ff ${c.remote}/${main}\ngit push`;
    h += `<div class="lc-sum info"><div class="lc-ic">💡</div><div style="flex:1;min-width:0"><b>${esc(t('lc.behindT', { ...P, n: c.behind }))}</b>
      <div>${esc(t('lc.behindD', P))}</div>${copyBtn(cmd)}</div></div>`;
  }
  if (c.problems.length > 1) h += `<div class="row" style="justify-content:flex-end;margin:6px 0"><button class="btn sm" data-lcall="${esc(env)}" data-v="1">${esc(t('lc.expandAll'))}</button><button class="btn sm" data-lcall="${esc(env)}" data-v="0">${esc(t('lc.collapseAll'))}</button></div>`;
  h += c.problems.map(p => problemCard(p, c)).join('');
  h += `<details class="lc-det"><summary>${esc(t('lc.breakdownT', { n: c.explainedFiles }))}</summary>
    <table><thead><tr><th>${esc(t('lc.th.feature'))}</th><th>${esc(t('lc.th.files'))}</th></tr></thead><tbody>
    ${c.features.map(f => `<tr><td class="mono">${esc(f.short)}</td><td>${f.files}</td></tr>`).join('')}
    ${c.trivialFiles ? `<tr><td class="muted">${esc(t('lc.trivial'))}</td><td>${c.trivialFiles}</td></tr>` : ''}</tbody></table>
    <div class="small muted">${esc(t('lc.breakdownD'))}</div></details>`;
  h += `<details class="lc-det"><summary>${esc(t('lc.howT'))}</summary>${t('lc.howBody', { e: esc(env), main: esc(main), paths: esc(c.paths.join(', ')) })}</details>`;
  const key = 'res|' + env, open = S.lcOpen[key] ?? true;
  return `<details class="lc-res" data-key="${esc(key)}" ${open ? 'open' : ''}><summary title="${esc(t('lc.toggle'))}">${verdict}</summary><div class="lc-body">${h}</div></details>`;
}
function problemCard(p, c) {
  const env = c.env, main = c.main, ov = S.ov, P = { e: env, main };
  const badges = (p.missingCount ? badge('b-bad', t('lc.missingBadge', { n: p.missingCount })) + ' ' : '') + (p.extraCount ? badge('b-warn', t('lc.extraBadge', { n: p.extraCount })) : '');
  const expl = [p.missingCount ? t('lc.missingExpl', P) : '', p.extraCount ? t('lc.extraExpl', P) : ''].filter(Boolean);
  const diff = p.hunks.map(hk => `<div class="lc-hunk">${esc(hk.header)}</div>` + hk.lines.map(l => {
    const cls = l.t === '-' ? 'del' : l.t === '+' ? 'add' : 'ctx';
    return `<div class="lc-l ${cls}${l.bad ? ' bad' : ''}"><span class="lc-s">${l.t === ' ' ? '&nbsp;' : l.t === '-' ? '−' : '+'}</span><span class="lc-c">${esc(l.s) || '&nbsp;'}</span>${l.bad ? '<span class="lc-m">◀</span>' : ''}</div>`;
  }).join('')).join('');
  const restore = `git checkout ${env}\ngit pull\ngit checkout ${ov.remote}/${main} -- ${p.file}\ngit commit -m "Restore ${p.file} from ${main}"\ngit push`;
  const key = `file|${env}|${p.file}`, open = S.lcOpen[key] ?? false;
  const notMerged = p.releasedSince.length ? ' ' + badge('b-info', t('lc.notMergedYet', P)) : '';
  return `<details class="lc-card" data-key="${esc(key)}" ${open ? 'open' : ''}>
    <summary class="row"><span class="chev">▸</span><b class="mono" style="flex:1;word-break:break-all">${esc(p.file)}</b>${badges}${notMerged}</summary>
    ${expl.map(x => `<p>${esc(x)}</p>`).join('')}
    <p class="small muted">${esc(p.touching.length ? t('lc.touching', { list: p.touching.join(', ') }) : t('lc.touchingNone', P))}</p>
    <div class="small"><b>${esc(t('lc.diffT', P))}</b> <span class="lc-leg del">${esc(t('lc.legendDel', P))}</span> <span class="lc-leg add">${esc(t('lc.legendAdd', P))}</span> <span class="lc-leg bad">◀ ${esc(t('lc.legendBad'))}</span></div>
    <div class="lc-diff">${diff}</div>
    <div class="small muted">${esc(t('lc.more'))}</div>
    ${p.commits.length ? `<div class="small" style="margin-top:8px"><b>${esc(t('lc.commitsT', P))}</b><table><tbody>${p.commits.map(x => `<tr><td class="mono">${esc(x.h)}</td><td class="nw">${esc(x.d)}</td><td>${esc(x.a)}</td><td>${esc(x.s)}</td></tr>`).join('')}</tbody></table></div>` : ''}
    ${p.releasedSince.length ? `<div class="small" style="margin-top:8px"><b>${esc(t('lc.sinceT', P))}</b><table><tbody>${p.releasedSince.map(x => `<tr><td class="mono">${esc(x.h)}</td><td class="nw">${esc(x.d)}</td><td>${esc(x.a)}</td><td>${esc(x.s)}</td></tr>`).join('')}</tbody></table></div>` : ''}
    <div style="margin-top:8px"><b>${esc(t('lc.fixT'))}</b>
      ${p.releasedSince.length ? `<p class="small" style="margin:4px 0">${esc(t('lc.fixMerge', P))}</p>`
        : p.touching.length ? `<p class="small" style="margin:4px 0">${esc(t('lc.fixManual', { ...P, list: p.touching.join(', ') }))}</p>`
        : `<p class="small" style="margin:4px 0">${esc(t('lc.fixRestore', P))}</p>${copyBtn(restore)}`}</div>
  </details>`;
}
function rebuildResult(rb, cmds) {
  const ov = S.ov, bad = rb.steps.filter(s => !s.ok);
  const summary = rb.diffSummary === 'identical' ? t('r.identical') : rb.diffSummary;
  return `<div style="margin-top:10px">
    <div class="row">${bad.length ? badge('b-bad', t('r.conflict', { n: bad.length })) : badge('b-ok', t('r.ok'))} <span class="small muted">${esc(t('r.vs', { e: rb.env, s: summary }))}</span></div>
    <table style="margin-top:6px"><tbody>${rb.steps.map(s => `<tr><td class="mono">${esc(s.branch)}</td><td>${s.ok ? badge('b-ok', t('r.merged')) : badge('b-bad', t('r.conflictOne'))}</td><td>${s.files ? `<ul class="files" style="margin:0">${s.files.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}</td></tr>`).join('')}</tbody></table>
    ${bad.length ? `<p class="small muted">${esc(t('r.fixFirst', { main: ov.main }))}</p>` :
      `<p class="small" style="margin-bottom:0"><b>${esc(t('r.ready'))}</b> ${esc(t('r.readyD', { e: rb.env, cmd: `git reset --hard ${ov.remote}/${rb.env}` }))}</p>${copyBtn(cmds)}`}
    ${rb.diffStat.length ? `<details style="margin-top:6px"><summary class="small muted">${esc(t('r.files', { e: rb.env }))}</summary><pre class="log">${esc(rb.diffStat.join('\n'))}</pre></details>` : ''}
  </div>`;
}

// ============================================================ cleanup

    ${ov.stashes.length ? `<div class="section"><header><h2>${esc(t('cl.stash', { n: ov.stashes.length }))}</h2><div class="hint">${esc(t('cl.stashH', { a: 'git stash show -p stash@{n}', b: 'git stash drop stash@{n}' }))}</div></header>
      <div class="tbl-wrap"><table><tbody>${ov.stashes.map(s => `<tr><td class="mono">${esc(s.ref)}</td><td class="nw">${esc(s.date)}</td><td>${esc(s.msg)}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
  </div>`;
  document.querySelectorAll('[data-all]').forEach(a => a.addEventListener('change', () => document.querySelectorAll(`[data-g="${a.dataset.all}"]`).forEach(i => { i.checked = a.checked; })));
  const picked = g => [...document.querySelectorAll(`[data-g="${g}"]:checked`)].map(i => i.value);
  $('#doRemote')?.addEventListener('click', () => confirmRun({
    title: t('cf.remote', { n: picked('remote').length }), items: picked('remote'), typed: 'delete', danger: true,

  $('#doRelease')?.addEventListener('click', () => confirmRun({
    title: t('cf.release', { n: picked('release').length }), items: picked('release').map(b => `${b}  →  ${b.replace(/^release\//, 'release-')}`), typed: 'delete',
    note: t('cf.releaseN'), run: () => api('/api/tag-releases', { branches: picked('release'), deleteBranch: true }) }));
  $('#doLocal')?.addEventListener('click', () => confirmRun({
    title: t('cf.local', { n: picked('local').length }), items: picked('local'),
    note: t('cf.localN'), run: () => api('/api/delete-local', { branches: picked('local') }) }));

function confirmRun({ title, items, note, typed, danger, run }) {
  if (!items.length) return toast(t('nothingSelected'));
  const dlg = $('#dlg');
  $('#dlgTitle').textContent = title;

document.addEventListener('keydown', e => {

// Search suggestions: same width as the search box; ↑/↓ to move, Enter to choose, Esc to close
function setupAutocomplete(input, list, onPick) {
  let items = [], active = -1;
  const names = () => {
    if (!S.graph) return [];
    const P = S.graph.plan, sh = n => n.replace(new RegExp('^' + P.remote + '/'), '');
    return S.graph.refs.map(r => ({ name: sh(r.name), kind: 'branch' })).concat(S.graph.tags.map(x => ({ name: x.name, kind: 'tag' })));
  };
  const close = () => { list.hidden = true; input.setAttribute('aria-expanded', 'false'); active = -1; };
  const render = () => {
    list.innerHTML = items.map((x, i) => {
      const k = x.name.toLowerCase().indexOf(input.value.trim().toLowerCase()), q = input.value.trim().length;
      const label = k < 0 || !q ? esc(x.name) : esc(x.name.slice(0, k)) + '<mark>' + esc(x.name.slice(k, k + q)) + '</mark>' + esc(x.name.slice(k + q));
      return `<div class="ac-item${i === active ? ' on' : ''}" role="option" data-i="${i}"><span class="mono">${label}</span>${x.kind === 'tag' ? '<span class="badge b-warn">tag</span>' : ''}</div>`;
    }).join('');
    list.hidden = !items.length; input.setAttribute('aria-expanded', String(!list.hidden));
    const on = list.querySelector('.on'); if (on) on.scrollIntoView({ block: 'nearest' });
  };
  const update = () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { items = []; close(); return; }
    const num = /^\d+$/.test(q) ? new RegExp('(^|[^0-9])' + q + '($|[^0-9])') : null;
    const score = n => { const l = n.toLowerCase(); return (l === q ? 0 : num && num.test(l) ? 1 : l.startsWith(q) ? 2 : 3) * 1000 + l.length; };
    items = names().filter(x => x.name.toLowerCase().includes(q)).sort((a, b) => score(a.name) - score(b.name)).slice(0, 12);
    active = items.length ? 0 : -1; render();
  };
  input.addEventListener('input', update);
  input.addEventListener('focus', () => { if (input.value.trim() && !S.netQuery) update(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' && items.length) { e.preventDefault(); if (list.hidden) { update(); return; } active = (active + 1) % items.length; render(); }
    else if (e.key === 'ArrowUp' && items.length) { e.preventDefault(); active = (active - 1 + items.length) % items.length; render(); }
    else if (e.key === 'Enter') { e.preventDefault(); const pick = !list.hidden && items[active] ? items[active].name : input.value; close(); onPick(pick); }
    else if (e.key === 'Escape') { if (!list.hidden) { e.preventDefault(); close(); } else onPick(''); }
  });
  input.addEventListener('blur', () => setTimeout(close, 120));
  list.addEventListener('mousedown', e => {
    const it = e.target.closest('.ac-item'); if (!it) return;
    e.preventDefault(); const x = items[+it.dataset.i]; close(); onPick(x.name);
  });
}

function drawNetwork(G, query) {
  const zoomGroup = [];                        // panels that zoom together (same zoom setting)

  const ancestors = (heads, extra) => { const seen = new Set(), st = [...heads]; while (st.length) { const h = st.pop(); if (seen.has(h)) continue; const c = extra.get(h) || byHash.get(h); if (!c) continue; seen.add(h); c.p.forEach(p => st.push(p)); } return seen; };

      if (kind === 'branches') keep.push(...P.keptOther);

        .concat(G.tags.map(x => ({ name: x.name, h: x.h, type: 'tag' }))).concat(P.releaseTags.map(x => ({ name: x.name, h: x.h, type: 'tag' })));
      if (kind === 'full') {
        const mt = refHash(P.main), tip = {}, feats = [], envs = [];
        P.unreleased.forEach(f => { let prev = mt; (P.featureCommits[f] || []).forEach((c, i) => { const h = `sim-${short(f)}-${i}`; feats.push({ h, p: [prev], a: c.a, d: today, s: c.s + '  (rebased)', syn: true }); prev = h; }); tip[f] = prev; });
        labels = labels.filter(l => !P.unreleased.map(short).includes(l.name)).concat(P.unreleased.map(f => ({ name: short(f), h: tip[f], type: 'branch' })));
        P.envs.forEach(e => { let prev = mt; const chain = []; e.tickets.forEach((f, i) => { const h = `sim-${e.name}-${i}`; chain.push({ h, p: [prev, tip[f]], a: '(simulated rebuild)', d: today, s: `Merge ${short(f)} into ${e.name}  (simulated)`, syn: true }); prev = h; }); labels.push({ name: e.name, h: prev, type: 'branch' }); envs.push(chain); });

    }
    const extra = new Map(synthetic.map(c => [c.h, c]));
    const reach = ancestors(labels.map(l => l.h), extra);

  }
  function layout(view, since) {
    const list = view.list.filter(c => !since || c.d >= since), idx = new Map(list.map((c, i) => [c.h, i]));
    const lanes = [], laneOf = new Map(), edges = [];
    const seed = ['master', 'main', ...P.envs.map(e => e.name)].map(n => (view.labels.find(l => l.name === n) || {}).h).filter(h => h && idx.has(h));
    [...new Set(seed)].forEach((h, k) => { lanes[k] = h; });
    const free = avoid => { for (let k = 0; ; k++) if (k !== avoid && lanes[k] == null) return k; };
    for (const c of list) {

      let lane; if (ks.length) { lane = Math.min(...ks); ks.forEach(k => { if (k !== lane) lanes[k] = null; }); } else lane = free(-1);
      lanes[lane] = null; laneOf.set(c.h, lane);

        else { let k = lanes.indexOf(p); if (k === -1) { k = free(lane); lanes[k] = p; } edges.push({ from: c.h, to: p, lane: k }); }

  }

  const COLORS = ['#2563eb', '#dc2626', '#16a34a', '#9333ea', '#ca8a04', '#0891b2', '#db2777', '#64748b', '#ea580c', '#059669', '#7c3aed', '#b45309'];

    const lastPer = {}; events.forEach(e => { if (!lastPer[e.target] || e.c.d >= lastPer[e.target].c.d) lastPer[e.target] = e; });   // label only the latest merge per target

    [...new Map(incoming.map(x => [x.from, x])).values()].forEach(x => labels.push({ name: '← ' + x.from, h: x.p, type: 'base' }));

// the normal view: whole repository now, compared with after cleanup
function drawCompare(G, since, buildView, layout, panel, main) {
  const now = buildView('now'), aft = buildView(NET.after);

  const b = panel(NET.after === 'full' ? t('n.fullT') : t('n.branchesT'), NET.after === 'full' ? t('n.fullD', { main }) : t('n.branchesD'), aft, La, a.st, zo);
  const box = $('#netPanels'); box.innerHTML = ''; box.append(a.el, b.el);
  [a, b].forEach(p => { if (!p.keep()) p.sc.scrollLeft = p.sc.scrollWidth; });

// ---------- commit details (click a dot, or search a commit hash)
function containingRefs(G, h) {
  if (!G._children) { G._children = new Map(); G.commits.forEach(c => c.p.forEach(p => { (G._children.get(p) || G._children.set(p, []).get(p)).push(c.h); })); }
  const desc = new Set([h]), st = [h];
  while (st.length) { const x = st.pop(); (G._children.get(x) || []).forEach(k => { if (!desc.has(k)) { desc.add(k); st.push(k); } }); }
  const P = G.plan, sh = n => n.replace(new RegExp('^' + P.remote + '/'), '');
  const refs = G.refs.map(r => ({ name: sh(r.name), h: r.h })).concat(G.tags.map(x => ({ name: x.name, h: x.h, tag: true })));
  return { in: refs.filter(r => desc.has(r.h)), out: refs.filter(r => !desc.has(r.h)) };
}
async function showCommit(h, scroll) {
  const box = $('#netDetail'); if (!box) return;
  box.innerHTML = `<div class="section"><div class="loading">${spin(t('loading'))}</div></div>`;
  if (!scroll) box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  let c; try { c = await api('/api/commit?h=' + encodeURIComponent(h)); } catch (e) { box.innerHTML = `<div class="section"><pre class="log">${esc(e.message)}</pre></div>`; return; }
  const G = S.graph, P = G.plan, sh = n => n.replace(new RegExp('^' + P.remote + '/'), '');
  const where = containingRefs(G, c.hash);
  const main = sh(P.main), keyNames = [main, ...P.envs.map(e => e.name), ...P.unmergedRelease.map(sh)];
  const group = rs => {
    const g = { key: rs.filter(r => keyNames.includes(r.name)), rel: rs.filter(r => !r.tag && /^release\//.test(r.name)), tag: rs.filter(r => r.tag), other: rs.filter(r => !r.tag && !keyNames.includes(r.name) && !/^release\//.test(r.name)) };
    g.rel = g.rel.filter(r => !g.key.includes(r));
    return g;
  };
  const gi = group(where.in), keyOut = where.out.filter(r => keyNames.includes(r.name));
  const chips = (rs, cls) => rs.map(r => `<span class="badge ${cls} mono">${esc(r.name)}</span>`).join(' ');
  box.innerHTML = `<div class="section"><header><h2>${esc(t('n.c.title'))} <span class="mono">${c.hash.slice(0, 10)}</span></h2><button class="btn sm" data-copy="${esc(c.hash)}">${esc(t('n.c.copy'))}</button><button class="btn sm" id="ncClose">✕</button>
      <div class="hint">${esc(c.date)} · ${esc(c.author)}</div></header>
    <div class="body grid" style="gap:12px">
      <div><b>${esc(c.subject)}</b>${c.body ? `<pre class="log" style="margin-top:6px">${esc(c.body)}</pre>` : ''}</div>
      <div class="kv">
        <div><span>${esc(t('n.c.in'))}</span><b>${gi.key.length ? chips(gi.key, 'b-ok') : ''} ${chips(gi.rel, 'b-info')} ${chips(gi.tag, 'b-warn')} ${gi.other.length > 8 ? chips(gi.other.slice(0, 8), 'b-mute') + ` <span class="muted small">+${gi.other.length - 8}</span>` : chips(gi.other, 'b-mute')}${where.in.length ? '' : `<span class="muted">${esc(t('n.c.inNone'))}</span>`}</b></div>
        ${keyOut.length ? `<div><span>${esc(t('n.c.notIn'))}</span><b>${chips(keyOut, 'b-bad')}</b></div>` : ''}
        <div><span>${esc(t('n.c.parents'))}</span><b>${c.parents.map(p => `<a href="#" class="mono" data-commit="${p}">${p.slice(0, 8)}</a>`).join(' ') || '—'}</b></div>
      </div>
      <div><b>${esc(t('n.c.files', { n: c.fileCount }))}</b>${c.parents.length > 1 ? `<div class="small muted">${esc(t('n.c.mergeFiles'))}</div>` : ''}
        ${c.files.length ? `<table style="margin-top:4px"><tbody>${c.files.map(f => `<tr><td class="mono">${esc(f.path)}</td><td class="nw" style="color:var(--ok)">+${esc(f.add)}</td><td class="nw" style="color:var(--bad)">−${esc(f.del)}</td></tr>`).join('')}</tbody></table>` : `<div class="small muted">—</div>`}</div>
    </div></div>`;
  $('#ncClose').onclick = () => { box.innerHTML = ''; };
  box.querySelectorAll('[data-commit]').forEach(a => a.onclick = e => { e.preventDefault(); showCommit(a.dataset.commit); });
}

    ? 'Backlog上のgitリポジトリのブランチの状態を1か所にまとめ、問題（コンフリクト、コードの欠落、リリース漏れ）を知らせ、整理を手伝うツールです。'
    : 'This tool shows the state of a git repository on Backlog in one place, warns about problems (conflicts, lost code, features missing from a release), and helps you clean up.';
  $('#main').innerHTML = `<div class="guide"><div class="top"><h1>📖 ${esc(title)}</h1></div>
    <p class="muted" style="margin-top:-8px">${esc(intro)}</p>
    <nav class="toc">${parts.map(([id, h]) => `<a href="#" data-goto="g-${id}">${esc(h)}</a>`).join('')}</nav>
    ${parts.map(([id, h, body]) => `<section id="g-${id}"><h2>${esc(h)}</h2>${body}</section>`).join('')}</div>`;
  $('#main').querySelectorAll('[data-goto]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); document.getElementById(a.dataset.goto).scrollIntoView({ behavior: 'smooth' }); }));
  $('#main').querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); if (S.ov || a.dataset.go === 'guide') show(a.dataset.go); }));
}

function resetRepoState() { S.ov = null; S.graph = null; S.results = {}; S.openRows = new Set(); S.lcOpen = {}; S.netQuery = ''; }
// Always start from the latest git data: fetch from the remote first, then read the repository.
async function fetchAndLoad() {
  $('#main').innerHTML = `<div class="loading">${spin(t('loadingFetch'))}</div>`;
  const b = $('#btnFetch'); b.disabled = true;
  let ok = false, noRepo = false;
  try { ok = (await api('/api/fetch', {})).ok; } catch (e) { noRepo = e.noRepo; }
  b.disabled = false;
  if (noRepo) return noRepoScreen();
  if (!ok) toast(t('fetchFailed'));
  $('#main').innerHTML = `<div class="loading">${spin(t('loading'))}</div>`;
  await load(true);
}
function noRepoScreen() {
  $('#repoName').textContent = '—'; $('#repoPath').textContent = '';
  $('#main').innerHTML = `<div class="section"><div class="empty">${esc(t('repo.none'))}<p><button class="btn primary" id="btnChoose">${esc(t('repo.choose'))}</button></p></div></div>`;
  $('#btnChoose').onclick = () => openRepoDialog();
  openRepoDialog();
}

const RD = { info: null, showBrowser: false };
async function openRepoDialog() {
  const dlg = $('#dlg');
  $('#dlgTitle').textContent = t('repo.title');

  $('#dlgClose').onclick = () => dlg.close();

  if (!dlg.open) dlg.showModal();
  let list;
  try { list = await api('/api/repos'); } catch (e) { $('#dlgBody').innerHTML = `<pre class="log">${esc(e.message)}</pre>`; return; }
  RD.info = null;
  if (list.current) { try { RD.info = await api('/api/repo/info'); } catch (e) {} }
  renderRepoDialog(list);
}
function renderRepoDialog(list) {
  const info = RD.info;
  let h = `<div id="repoStatus"></div>`;
  if (list.repos.length) h += `<div class="dsec">${esc(t('repo.recent'))}</div><div class="rlist">${list.repos.map(r => `
    <div class="ritem ${r.current ? 'cur' : ''}"><div class="grow"><b>${esc(r.name)}</b> ${r.current ? badge('b-info', t('repo.current')) : ''} ${r.exists ? '' : badge('b-bad', t('repo.missing'))}<div class="p">${esc(r.path)}</div></div>
    ${r.current ? '' : `<button class="btn sm primary" data-open="${esc(r.path)}" ${r.exists ? '' : 'disabled'}>${esc(t('repo.open'))}</button><button class="btn sm" data-forget="${esc(r.path)}" title="${esc(t('repo.remove'))}">✕</button>`}</div>`).join('')}</div>`;
  h += `<div class="dsec">${esc(t('repo.add'))}</div>
    <div class="row"><input type="text" id="repoPathIn" placeholder="${esc(t('repo.pathPh', { ex: list.platform === 'win32' ? 'C:\\Users\\you\\git\\project' : (list.home || '/home/you') + '/git/project' }))}" style="flex:1;min-width:220px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit">
      <button class="btn primary" id="repoOpenPath">${esc(t('repo.open'))}</button><button class="btn" id="repoBrowse">${esc(t('repo.browse'))}</button></div>
    <div id="browser"></div>`;
  if (info) {
    const s = info.settings, notTopic = b => !/^(feature|hotfix|bugfix|release)\//.test(b);
    const envCands = info.branches.filter(b => notTopic(b) && b !== s.main);
    h += `<div class="dsec">${esc(t('repo.settings', { name: info.path.split(/[\\/]/).pop() }))}</div>
      ${info.remotes.length > 1 ? `<label class="field"><span>${esc(t('repo.remote'))}</span><select id="setRemote">${info.remotes.map(r => `<option ${r === s.remote ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></label>` : ''}
      <label class="field"><span>${esc(t('repo.main'))}</span><select id="setMain">${info.branches.filter(notTopic).map(b => `<option ${b === s.main ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select><small>${esc(t('repo.mainHint'))}</small></label>
      <div class="field"><span>${esc(t('repo.envs'))}</span><div class="row">${envCands.length ? envCands.map(b => `<label class="chk"><input type="checkbox" data-env value="${esc(b)}" ${s.envs.includes(b) ? 'checked' : ''}> <span class="mono">${esc(b)}</span></label>`).join('') : `<small>${esc(t('repo.noEnvCandidates'))}</small>`}</div><small>${esc(t('repo.envsHint'))}</small></div>
      <label class="field"><span>${esc(t('repo.checkPaths'))}</span><input type="text" id="setPaths" value="${esc(s.checkPaths.join(', '))}"><small>${esc(t('repo.checkPathsHint'))}</small></label>
      <button class="btn primary" id="repoSave">${esc(t('repo.save'))}</button>`;
  }
  $('#dlgBody').innerHTML = h;
  const body = $('#dlgBody');
  body.querySelectorAll('.rlist [data-open]').forEach(b => b.onclick = () => switchRepo(b.dataset.open));
  body.querySelectorAll('[data-forget]').forEach(b => b.onclick = async () => {
    try { renderRepoDialog(await api('/api/repo/forget', { path: b.dataset.forget })); } catch (e) { repoStatus(e.message, true); }
  });
  $('#repoOpenPath').onclick = () => switchRepo($('#repoPathIn').value.trim());
  $('#repoPathIn').onkeydown = e => { if (e.key === 'Enter') switchRepo(e.target.value.trim()); };
  $('#repoBrowse').onclick = () => { RD.showBrowser = true; renderBrowser($('#repoPathIn').value.trim() || null); };
  if (RD.showBrowser) renderBrowser(null);
  if (info) $('#repoSave').onclick = async () => {
    const payload = {
      remote: $('#setRemote') ? $('#setRemote').value : info.settings.remote, main: $('#setMain').value,
      envs: [...body.querySelectorAll('[data-env]:checked')].map(i => i.value), checkPaths: $('#setPaths').value.split(','),
    };
    try {
      await api('/api/repo/settings', payload);
      $('#dlg').close(); toast(t('repo.saved')); resetRepoState();
      $('#main').innerHTML = `<div class="loading">${spin(t('loading'))}</div>`;
      await load(true);
    } catch (e) { repoStatus(e.message, true); }
  };
}
function repoStatus(msg, isError) {
  const el = $('#repoStatus'); if (!el) return;
  el.innerHTML = isError ? `<pre class="log" style="color:var(--bad)">${esc(msg)}</pre>` : `<div class="loading" style="padding:8px 0">${spin(msg)}</div>`;
}
async function switchRepo(p) {
  if (!p) return;
  repoStatus(t('repo.opening'));
  try {
    const list = await api('/api/repo/select', { path: p });
    const cur = list.repos.find(r => r.current);
    $('#dlg').close(); RD.showBrowser = false; resetRepoState();
    toast(t('repo.switched', { name: cur ? cur.name : p }));
    await fetchAndLoad();
  } catch (e) { repoStatus(e.message, true); }
}
async function renderBrowser(dir) {
  const box = $('#browser'); if (!box) return;
  box.innerHTML = `<div class="loading">${spin(t('loading'))}</div>`;
  let b;
  try { b = await api('/api/browse' + (dir ? '?dir=' + encodeURIComponent(dir) : '')); } catch (e) { box.innerHTML = `<pre class="log">${esc(e.message)}</pre>`; return; }
  box.innerHTML = `<div class="browser"><div class="bar"><div class="cur">📂 ${esc(b.dir)}</div>
      ${b.parent ? `<button class="btn sm" data-dir="${esc(b.parent)}">${esc(t('repo.up'))}</button>` : ''}
      <button class="btn sm" data-dir="${esc(b.home)}">${esc(t('repo.home'))}</button>
      ${b.drives.map(d => `<button class="btn sm" data-dir="${esc(d)}">${esc(d)}</button>`).join('')}
      ${b.isRepo ? `<span style="flex:1"></span><span class="small muted">${esc(t('repo.isRepo'))}</span><button class="btn sm primary" data-open="${esc(b.dir)}">${esc(t('repo.openThis'))}</button>` : ''}</div>
    <div class="ents">${b.entries.length ? b.entries.map(e => `<div class="ent" data-dir="${esc(e.path)}"><span>${e.isRepo ? '📦' : '📁'}</span><span class="grow">${esc(e.name)}</span>${e.isRepo ? `${badge('b-ok', 'git')} <button class="btn sm primary" data-open="${esc(e.path)}">${esc(t('repo.open'))}</button>` : ''}</div>`).join('') : `<div class="empty">${esc(t('repo.noFolders'))}</div>`}</div></div>`;
  box.querySelectorAll('[data-dir]').forEach(el => el.addEventListener('click', ev => { if (ev.target.closest('[data-open]')) return; renderBrowser(el.dataset.dir); }));
  box.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', ev => { ev.stopPropagation(); switchRepo(el.dataset.open); }));
  const inp = $('#repoPathIn'); if (inp) inp.value = b.dir;
}

applyStatic();
$('#btnRepo').addEventListener('click', () => openRepoDialog());
const openReposAtStart = location.hash === '#repos';
fetchAndLoad().then(() => { if (openReposAtStart && S.ov) openRepoDialog(); });
</script>
</body>
</html>
